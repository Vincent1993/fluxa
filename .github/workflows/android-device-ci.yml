name: Android device compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxa-device-bounded-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  device:
    name: Upgrade and device tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '36'
            tag: google_apis
            page_size: '4096'
          - api: '37.0'
            tag: google_apis_ps16k
            page_size: '16384'
    env:
      FLUXA_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      ANDROID_SERIAL: emulator-5554
      TEST_API: ${{ matrix.api }}
      TEST_TAG: ${{ matrix.tag }}
      EXPECTED_PAGE_SIZE: ${{ matrix.page_size }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.FLUXA_BUILD_COMMIT }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true
      - name: Install baseline, candidate and device SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "cmdline-tools;22.0" "platforms;android-35" "build-tools;34.0.0" \
            "platforms;android-37.0" "build-tools;36.0.0" "emulator" "platform-tools" \
            "system-images;android-$TEST_API;$TEST_TAG;x86_64"
      - name: Build old and new APKs with the same ephemeral test certificate
        run: |
          git worktree add --detach ../fluxa-upgrade-baseline b61c6d97995dd79f3c2ff549da28a6f802471d77
          cp app/src/androidTest/java/com/fluxa/app/UpgradePreservationTest.kt \
            ../fluxa-upgrade-baseline/app/src/androidTest/java/com/fluxa/app/UpgradePreservationTest.kt
          (cd ../fluxa-upgrade-baseline && FLUXA_BUILD_COMMIT=b61c6d97995dd79f3c2ff549da28a6f802471d77 \
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace)
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Boot a fresh isolated emulator and verify its actual API and page size
        timeout-minutes: 15
        run: |
          mkdir -p device-reports
          printf '%s\n' "$FLUXA_BUILD_COMMIT" > device-reports/BUILD_COMMIT.txt
          test -c /dev/kvm
          kvm_gid=$(getent group kvm | cut -d: -f3)
          sudo -n setpriv --reuid "$(id -u)" --regid "$kvm_gid" --clear-groups --no-new-privs \
            -- "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee device-reports/acceleration.txt
          export ANDROID_USER_HOME="$RUNNER_TEMP/fluxa-upgrade-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/22.0/bin/avdmanager" create avd \
            --force --name fluxa-device-ci --package "system-images;android-$TEST_API;$TEST_TAG;x86_64" \
            --device pixel_2 --path "$ANDROID_AVD_HOME/fluxa-device-ci.avd"
          cat "$ANDROID_AVD_HOME/fluxa-device-ci.ini" | tee device-reports/avd-target.txt
          grep -Fx "target=android-$TEST_API" "$ANDROID_AVD_HOME/fluxa-device-ci.ini"
          cat "$ANDROID_HOME/cmdline-tools/22.0/source.properties" > device-reports/command-line-tools.txt
          printf 'hw.cpu.ncore=2\nhw.ramSize=4096\nhw.keyboard=no\ndisk.dataPartition.size=6G\n' >> "$ANDROID_AVD_HOME/fluxa-device-ci.avd/config.ini"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/platform-tools/adb" start-server
          sudo -n setpriv --reuid "$(id -u)" --regid "$kvm_gid" --clear-groups --no-new-privs -- /usr/bin/env \
            HOME="$HOME" USER="$USER" ANDROID_USER_HOME="$ANDROID_USER_HOME" ANDROID_AVD_HOME="$ANDROID_AVD_HOME" \
            ANDROID_HOME="$ANDROID_HOME" ANDROID_SDK_ROOT="$ANDROID_HOME" \
            "$ANDROID_HOME/emulator/emulator" -avd fluxa-device-ci -port 5554 \
            -no-window -no-audio -no-snapshot -no-boot-anim -gpu swangle -feature -Vulkan -accel on \
            > device-reports/emulator.log 2>&1 &
          emulator_pid=$!
          boot_deadline=$((SECONDS + 600))
          while [[ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= boot_deadline )); then
              cat device-reports/emulator.log
              echo 'Emulator exited or failed to boot within 600 seconds.' >&2
              exit 1
            fi
            sleep 2
          done
          "$ANDROID_HOME/platform-tools/adb" shell df -h /data > device-reports/storage-before.txt
          actual_api=$("$ANDROID_HOME/platform-tools/adb" shell getprop ro.build.version.sdk | tr -d '\r')
          if actual_page=$("$ANDROID_HOME/platform-tools/adb" shell getconf PAGESIZE 2>/dev/null); then
            actual_page=$(printf '%s' "$actual_page" | tr -d '\r')
          else
            # API26 has no getconf. Read the real kernel page size of the shell process.
            actual_page=$("$ANDROID_HOME/platform-tools/adb" shell cat /proc/self/smaps | \
              awk '/^KernelPageSize:/ && !seen {print $2 * 1024; seen = 1}')
          fi
          test "$actual_api" = "${TEST_API%%.*}"
          test "$actual_page" = "$EXPECTED_PAGE_SIZE"
          printf 'API=%s\nPAGE_SIZE=%s\n' "$actual_api" "$actual_page" > device-reports/device.txt
          "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell input keyevent 82
          package_deadline=$((SECONDS + 120))
          until "$ANDROID_HOME/platform-tools/adb" shell pm path android | grep -q '^package:'; do
            (( SECONDS < package_deadline )) || { echo 'Package manager is not ready.' >&2; exit 1; }
            sleep 2
          done
      - name: Replace the baseline APK without uninstalling and verify retained data
        run: |
          bash scripts/device-upgrade-test.sh \
            ../fluxa-upgrade-baseline/app/build/outputs/apk/debug/app-debug.apk \
            ../fluxa-upgrade-baseline/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk device-reports
      - name: Preserve device diagnostics
        timeout-minutes: 3
        if: ${{ always() }}
        run: |
          mkdir -p device-reports
          timeout 15s "$ANDROID_HOME/platform-tools/adb" logcat -d -b crash > device-reports/crash-buffer.log 2>&1 || true
          if [ "${{ job.status }}" != success ]; then
            cat device-reports/crash-buffer.log
            tail -n 100 device-reports/emulator.log 2>/dev/null || true
          fi
          for name in validation-reader.png validation-records.png; do
            if timeout 10s "$ANDROID_HOME/platform-tools/adb" shell run-as com.fluxa.app.debug test -f "files/$name"; then
              if timeout 15s "$ANDROID_HOME/platform-tools/adb" exec-out run-as com.fluxa.app.debug cat "files/$name" > "device-reports/$name"; then
                printf 'FLUXA_SCREENSHOT_%s_BASE64=%s\n' "$name" "$(base64 -w 0 "device-reports/$name")"
              else
                rm -f "device-reports/$name"
              fi
            fi
          done
          timeout 10s "$ANDROID_HOME/platform-tools/adb" emu kill || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: fluxa-device-api-${{ matrix.api }}
          path: device-reports/
          if-no-files-found: error
          retention-days: 14
