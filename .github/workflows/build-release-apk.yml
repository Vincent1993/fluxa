name: Android Verify And Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布到 GitHub Release 的 tag；留空仅验证'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fluxa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Verify tests, lint and APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fluxa-validation
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Build release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Sign when all signing secrets are configured
        if: env.KEYSTORE_BASE64 != '' && env.KEY_ALIAS != '' && env.KEYSTORE_PASSWORD != '' && env.KEY_PASSWORD != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ env.KEYSTORE_BASE64 }}
          alias: ${{ env.KEY_ALIAS }}
          keyStorePassword: ${{ env.KEYSTORE_PASSWORD }}
          keyPassword: ${{ env.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: fluxa-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "value=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish signed APK
        if: steps.sign_app.outputs.signedReleaseFile != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          generate_release_notes: true
      - name: Publish unsigned APK
        if: steps.sign_app.outputs.signedReleaseFile == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
