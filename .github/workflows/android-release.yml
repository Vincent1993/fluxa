name: Prepare Android Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel (Stable requires separate approval and signing setup)
        type: choice
        options: [preview, stable]
        default: preview
        required: true
      tag:
        description: Exact changelog tag, for example v0.2.0-preview.1
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: fluxa-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FLUXA_BUILD_COMMIT: ${{ github.sha }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    name: Validate trusted release source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require main, exact version, changelog and increasing code
        id: version
        env:
          STABLE_RELEASE_ENABLED: ${{ vars.ENABLE_STABLE_RELEASE }}
        run: |
          if [ "$RELEASE_CHANNEL" = stable ] && [ "$STABLE_RELEASE_ENABLED" != true ]; then
            echo "Stable release is disabled until separately approved and configured."
            exit 1
          fi
          mkdir payload
          python3 scripts/release.py preflight --trusted --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --notes payload/release-notes.md \
            --github-output "$GITHUB_OUTPUT"
          if [ "$RELEASE_CHANNEL" = preview ]; then
            echo "variant=Preview" >> "$GITHUB_OUTPUT"
          else
            echo "variant=Release" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;34.0.0"
      - name: Test exact unsigned candidate without secrets
        env:
          VARIANT: ${{ steps.version.outputs.variant }}
          DIRECTORY: ${{ steps.version.outputs.build_type }}
        run: |
          python3 scripts/test_release.py
          ./gradlew ":app:test${VARIANT}UnitTest" ":app:lint$VARIANT" ":app:assemble$VARIANT" \
            --continue --no-daemon --stacktrace
          cp "app/build/outputs/apk/$DIRECTORY/app-$DIRECTORY-unsigned.apk" payload/unsigned.apk
          python3 scripts/release.py apk --channel "$RELEASE_CHANNEL" --apk payload/unsigned.apk \
            --output payload/unsigned-metadata.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-unsigned
          path: payload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  sign:
    name: Sign with persistent channel certificate
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-unsigned
          path: candidate/
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;34.0.0"
      - name: Check candidate before accessing signing credentials
        run: |
          python3 scripts/release.py apk --channel "$RELEASE_CHANNEL" --apk candidate/unsigned.apk
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = json.loads(Path("candidate/unsigned-metadata.json").read_text())
          if hashlib.sha256(Path("candidate/unsigned.apk").read_bytes()).hexdigest() != expected["apk_sha256"]:
              raise ValueError("Candidate checksum mismatch")
          PY
      - name: Sign tested APK and pin certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FLUXA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLUXA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLUXA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          for setting in ANDROID_KEYSTORE_BASE64 FLUXA_KEYSTORE_PASSWORD FLUXA_KEY_ALIAS FLUXA_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            [ -n "${!setting}" ] || { echo "Missing required signing setting: $setting"; exit 1; }
          done
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "fluxa-signing.p12").write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          PY
          mkdir dist
          APK_NAME="fluxa-$RELEASE_TAG-$RELEASE_CHANNEL.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/fluxa-signing.p12" --ks-key-alias "$FLUXA_KEY_ALIAS" \
            --ks-pass env:FLUXA_KEYSTORE_PASSWORD --key-pass env:FLUXA_KEY_PASSWORD \
            --out "dist/$APK_NAME" candidate/unsigned.apk
          python3 scripts/release.py apk --channel "$RELEASE_CHANNEL" --apk "dist/$APK_NAME" \
            --signed --output dist/release-metadata.json
          cp candidate/release-notes.md dist/release-notes.md
          cd dist
          sha256sum "$APK_NAME" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Remove temporary keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/fluxa-signing.p12"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-candidate
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft:
    name: Create draft release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-candidate
          path: dist/
      - name: Recheck source, checksum and release identity
        run: |
          python3 scripts/release.py preflight --trusted --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          (cd dist && sha256sum -c SHA256SUMS)
          python3 - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import release
          expected = release.expected(release.read_version(Path("version.properties").read_text()),
                                      os.environ["RELEASE_CHANNEL"], os.environ["GITHUB_SHA"])
          actual = json.loads(Path("dist/release-metadata.json").read_text())
          for key, value in expected.items():
              if actual[key] != value:
                  raise ValueError("Release identity mismatch: " + key)
          apk = list(Path("dist").glob("*.apk"))
          if len(apk) != 1 or not actual["signed"] or not actual["signing_certificate_sha256"]:
              raise ValueError("Missing signed APK or certificate metadata")
          if hashlib.sha256(apk[0].read_bytes()).hexdigest() != actual["apk_sha256"]:
              raise ValueError("Signed APK checksum mismatch")
          PY
      - name: Create tag and draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release already exists. Preserve it; inspect or recover it manually."
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$GITHUB_SHA" > /dev/null
          fi
          flags=(--verify-tag --draft --latest=false)
          if [ "$RELEASE_CHANNEL" = preview ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.apk dist/SHA256SUMS dist/release-metadata.json \
            --repo "$GITHUB_REPOSITORY" --title "Fluxa $RELEASE_TAG" \
            --notes-file dist/release-notes.md "${flags[@]}"
          echo "Draft prepared. Verify the downloaded APK before explicitly publishing."
