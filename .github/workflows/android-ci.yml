name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxa-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Test the exact PR head; report it rather than GitHub's synthetic merge SHA.
  FLUXA_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  BUILD_PLATFORM: '35'
  BUILD_TOOLS: '34.0.0'

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Version and release policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.FLUXA_BUILD_COMMIT }}
      - name: Check version and release safeguards
        run: |
          python3 scripts/release.py version
          python3 scripts/test_release.py
          python3 scripts/test_prepare_key.py
          python3 scripts/release.py preflight --channel preview --tag "$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import release; v=release.read_version(open("version.properties").read()); print(release.expected(v, "preview")["tag"])')"
      - name: Check new PR branch naming
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number > 6 && github.actor != 'dependabot[bot]' }}
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          [[ "$PR_BRANCH" =~ ^(feature|fix|chore|docs)/[a-z0-9]+(-[a-z0-9]+)*$ ]] || {
            echo "Use feature/, fix/, chore/ or docs/ with a lowercase kebab-case name."
            exit 1
          }

  verify:
    name: Tests, lint and APK (${{ matrix.channel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: debug
            variant: Debug
            directory: debug
            apk: app-debug.apk
          - channel: preview
            variant: Preview
            directory: preview
            apk: app-preview-unsigned.apk
          - channel: stable
            variant: Release
            directory: release
            apk: app-release-unsigned.apk
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.FLUXA_BUILD_COMMIT }}
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache and validate Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - name: Install required Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$BUILD_PLATFORM" "build-tools;$BUILD_TOOLS"
      - name: Record exact source and toolchain
        run: |
          mkdir -p app/build/reports/ci
          test "$(git rev-parse HEAD)" = "$FLUXA_BUILD_COMMIT"
          printf '%s\n' "$FLUXA_BUILD_COMMIT" > app/build/reports/ci/BUILD_COMMIT.txt
          {
            java -version
            ./gradlew --version
            cat "$ANDROID_HOME/platforms/android-$BUILD_PLATFORM/source.properties"
            cat "$ANDROID_HOME/build-tools/$BUILD_TOOLS/source.properties"
          } > app/build/reports/ci/toolchain.txt 2>&1
      - name: Test, lint and build channel
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          ./gradlew ":app:test${VARIANT}UnitTest" ":app:lint$VARIANT" ":app:assemble$VARIANT" \
            --continue --no-daemon --stacktrace
      - name: Verify actual APK identity and signing boundary
        env:
          CHANNEL: ${{ matrix.channel }}
          APK: app/build/outputs/apk/${{ matrix.directory }}/${{ matrix.apk }}
        run: |
          python3 scripts/release.py apk --channel "$CHANNEL" --apk "$APK" \
            --output app/build/reports/channel-metadata.json
      - name: Record APK checksum
        env:
          APK_DIRECTORY: app/build/outputs/apk/${{ matrix.directory }}
          APK_NAME: ${{ matrix.apk }}
        run: |
          cp app/build/reports/ci/BUILD_COMMIT.txt "$APK_DIRECTORY/BUILD_COMMIT.txt"
          cp app/build/reports/channel-metadata.json "$APK_DIRECTORY/channel-metadata.json"
          (cd "$APK_DIRECTORY" && sha256sum "$APK_NAME" > SHA256SUMS && sha256sum -c SHA256SUMS)
          cp "$APK_DIRECTORY/SHA256SUMS" app/build/reports/ci/SHA256SUMS
          {
            printf '### %s APK\n\nCommit: `%s`\n\n' '${{ matrix.channel }}' "$FLUXA_BUILD_COMMIT"
            cat app/build/reports/ci/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable Debug APK
        if: ${{ success() && matrix.channel == 'debug' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fluxa-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/BUILD_COMMIT.txt
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/debug/channel-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload channel validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fluxa-validation-${{ matrix.channel }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  instrumentation:
    name: Device tests (Android 16 / API 36)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: policy
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.FLUXA_BUILD_COMMIT }}
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache and validate Wrapper
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true
      - name: Check KVM and official stable image
        run: |
          mkdir -p app/build/reports/ci-device
          printf '%s\n' "$FLUXA_BUILD_COMMIT" > app/build/reports/ci-device/BUILD_COMMIT.txt
          test "$(git rev-parse HEAD)" = "$FLUXA_BUILD_COMMIT"
          # Use existing runner access; never change device permissions or security settings.
          test -c /dev/kvm
          getent group kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=0 \
            > app/build/reports/ci-device/sdk-packages.txt
          grep -F 'system-images;android-36;google_apis;x86_64' \
            app/build/reports/ci-device/sdk-packages.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-$BUILD_PLATFORM" "build-tools;$BUILD_TOOLS" \
            "emulator" "system-images;android-36;google_apis;x86_64"
          # Change only the emulator process's effective group, never /dev/kvm permissions.
          sudo -u "$(id -un)" -g kvm -- "$ANDROID_HOME/emulator/emulator" -accel-check \
            > app/build/reports/ci-device/acceleration.txt 2>&1
          cat "$ANDROID_HOME/emulator/source.properties" \
            "$ANDROID_HOME/system-images/android-36/google_apis/x86_64/source.properties" \
            > app/build/reports/ci-device/emulator-toolchain.txt
      - name: Build test APKs before starting emulator
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Run fixture tests on fresh API 36 emulator
        timeout-minutes: 15
        run: |
          # A new AVD every run; no snapshot, account, or application-data cache.
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force -n fluxa_api36 --package 'system-images;android-36;google_apis;x86_64' --device pixel_7
          printf 'hw.cpu.ncore=2\nhw.ramSize=4096\n' >> "$HOME/.android/avd/fluxa_api36.avd/config.ini"
          export ANDROID_SERIAL=emulator-5554
          "$ANDROID_HOME/platform-tools/adb" start-server
          cleanup() {
            "$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" emu kill || true
          }
          trap cleanup EXIT
          sudo -u "$(id -un)" -g kvm -- "$ANDROID_HOME/emulator/emulator" \
            -avd fluxa_api36 -port 5554 -no-window -gpu swiftshader_indirect \
            -no-snapshot -noaudio -no-boot-anim -accel on \
            > app/build/reports/ci-device/emulator.log 2>&1 &
          emulator_pid=$!
          boot_deadline=$((SECONDS + 600))
          while [[ "$("$ANDROID_HOME/platform-tools/adb" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= boot_deadline )); then
              cat app/build/reports/ci-device/emulator.log
              echo 'Emulator exited or failed to boot within 600 seconds.' >&2
              exit 1
            fi
            sleep 2
          done
          "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
          ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload device validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fluxa-validation-device-api36
          path: |
            app/build/reports/ci-device/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
